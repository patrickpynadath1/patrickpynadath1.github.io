<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121321">
  <title>Wave study — Patrick Pynadath</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('wave-study-theme') === 'light' ? 'light' : 'dark'; } catch {}
  </script>
  <style>
    :root { color-scheme: light; --paper: #f6f4fc; --ink: #34314c; --muted: #686079; --line: #d9d2e6; --accent: #8564b8; --panel: #ebe5f5; }
    :root[data-theme="dark"] { color-scheme: dark; --paper: #121321; --ink: #efebfa; --muted: #b5aecb; --line: #363348; --accent: #c6b0ff; --panel: #262338; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Noto Sans", "Helvetica Neue", sans-serif; }
    main { width: min(1440px, 100%); min-height: 100svh; margin: auto; padding: 32px 5vw 24px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; font-size: 14px; }
    header a { color: inherit; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .study-label { color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 18px; }
    .composition { flex: 1; display: grid; place-items: center; padding: 20px 0 30px; }
    h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 400; font-size: clamp(42px, 5.1vw, 76px); line-height: 1.06; letter-spacing: -.055em; margin: 0 0 25px; }
    .intro p { max-width: 28ch; font-size: 16px; line-height: 1.7; color: var(--muted); margin: 0; }
    figure { margin: 0; min-width: 0; width: min(680px, 100%); }
    .art { aspect-ratio: 1; display: grid; place-items: center; }
    .art svg { width: 100%; height: 100%; overflow: visible; }
    .art path { stroke: var(--wave-light, #9271be); stroke-width: 1.85; }
    [data-theme="dark"] .art path { stroke: var(--wave-dark, #c6b0ff); }
    [data-theme="dark"] .art svg { filter: drop-shadow(0 0 3px #b8a5ff50); }
    figcaption { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 12px 6% 0; }
    .controls { display: flex; align-items: center; gap: 30px; border-top: 1px solid var(--line); padding-top: 22px; flex-wrap: wrap; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    button { font: inherit; font-size: 13px; min-height: 42px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); padding: 10px 17px; cursor: pointer; }
    button:hover { background: var(--panel); }
    button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .slider { display: grid; grid-template-columns: auto auto; gap: 8px 24px; width: 160px; font-size: 12px; }
    output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; height: 18px; }
    .status { margin: 0 0 0 auto; color: var(--muted); font-size: 12px; }
    footer { margin-top: 22px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
    #performance { font-variant-numeric: tabular-nums; }
    footer a { color: inherit; text-underline-offset: 3px; }
    @media (min-width: 1000px) { .art { max-height: 72svh; } }
    @media (max-width: 700px) {
      main { padding: 24px 6vw; }
      header { font-size: 12px; }
      .composition { padding: 30px 0; }
      h1 { font-size: 48px; max-width: 10ch; margin-bottom: 16px; }
      .intro p { max-width: 35ch; font-size: 14px; }
      .controls { gap: 22px; justify-content: space-between; }
      .buttons { width: 100%; }
      .slider { width: calc(50% - 12px); }
      .status { margin: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header><span>Discrete to continuous</span><div class="header-actions"><button id="theme" type="button" aria-pressed="true">Dark mode</button></div></header>
    <section class="composition" aria-label="Animated shape study">
      <figure>
        <div class="art" id="art" aria-label="Forty-two separate lines unfolding into a flowing wave" role="img">
          <img src="./shape.svg" alt="Separate horizontal lines transitioning into waves" width="296" height="303" style="width:88%;height:auto">
        </div>
        <figcaption><span>Discrete</span><span>Continuous</span></figcaption>
      </figure>
    </section>
    <div class="controls" aria-label="Animation controls">
      <div class="buttons">
        <button id="pause" type="button" aria-pressed="false">Stop motion</button>
        <button id="mouse" type="button" aria-pressed="false" aria-describedby="mouse-help">Mouse-driven</button>
        <button id="original" type="button" aria-pressed="false">Original shape</button>
      </div>
      <label class="slider" for="speed">Speed <output id="speed-value" for="speed">0.6×</output><input id="speed" type="range" min="0.1" max="1.5" value="0.6" step="0.1"></label>
      <label class="slider" for="intensity">Wave intensity <output id="intensity-value" for="intensity">40%</output><input id="intensity" type="range" min="0" max="100" value="40" step="1"></label>
      <p class="status" id="status" role="status">Slow traveling wave</p>
    </div>
    <p id="mouse-help" style="font-size:12px;color:var(--muted);margin:14px 0 0">Mouse-driven: move anywhere on the page to energize the waves; hold still to let them settle. Touch dragging works too.</p>
    <footer><span>Shape from <a href="https://bookofshapes.com">Book of Shapes</a>.</span><span id="performance" title="Live animation frame rate and average JavaScript update time. Update time excludes browser painting.">Measuring playback…</span></footer>
  </main>
  <script>
    const themeButton = document.querySelector('#theme');
    function updateTheme() {
      const dark = document.documentElement.dataset.theme === 'dark';
      themeButton.setAttribute('aria-pressed', String(dark));
      document.querySelector('meta[name="theme-color"]').content = dark ? '#121321' : '#f6f4fc';
    }
    themeButton.addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('wave-study-theme', theme); } catch {}
      updateTheme();
    });
    updateTheme();
  </script>
  <script type="module" src="./wave.js"></script>
</body>
</html>
